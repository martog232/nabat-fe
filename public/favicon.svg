<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nabat">
  <!--
    A dot, not the pin from the sign-in screen. At 16 CSS pixels a tab icon has room for one
    shape, and the pin's stem and hole disappear into a smudge; a filled circle survives.
    #e11d48 is brand-600 — the same red as the app's primary actions and the map markers.
  -->
  <circle cx="16" cy="16" r="13" fill="#e11d48" />
</svg>
