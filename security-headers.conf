# Included into the server block AND into every location block that sets an
# add_header of its own.
#
# nginx's add_header does not merge across levels: a location that declares any
# add_header discards every header inherited from its parent. `always` does not
# change that — it only controls whether a header survives an error response.
# So `location = /index.html`, which sets Cache-Control, was silently dropping all
# five headers below, and it is the location that matters most: every SPA route
# ends there through `try_files ... /index.html`, whose internal redirect re-runs
# location matching. The main document — the only one a CSP actually governs —
# was served with no CSP at all, while the headers looked present in the config.
#
# Keep this file included anywhere an add_header appears. Adding a bare add_header
# to a location without it re-opens the same hole.
#
# CSP notes:
#  - 'unsafe-inline' for styles is required by Tailwind's runtime style injection
#    and by Leaflet, which sets inline styles on map panes. Scripts do NOT get it.
#  - fonts.googleapis.com is a style-src, not a font-src: src/index.css opens with
#    an @import of the Inter stylesheet, and an @import is fetched under the
#    importing document's style-src. The font files it then references come from
#    fonts.gstatic.com, which is why both hosts are named. Self-host the face and
#    both can go.
#  - connect-src must list the API and WebSocket origins. Adjust for your
#    deployment, or template it — the defaults below assume same-origin.
#  - img-src allows data: and blob: for the photo preview (URL.createObjectURL).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Only meaningful over HTTPS; harmless otherwise. Enable once TLS terminates here.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
