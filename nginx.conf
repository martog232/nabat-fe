server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # This app keeps its access and refresh tokens in localStorage, so XSS is a
    # session-theft vector rather than just a defacement risk. There were previously
    # no security headers at all.
    #
    # CSP notes:
    #  - 'unsafe-inline' for styles is required by Tailwind's runtime style injection
    #    and by Leaflet, which sets inline styles on map panes. Scripts do NOT get it.
    #  - connect-src must list the API and WebSocket origins. Adjust for your
    #    deployment, or template it — the defaults below assume same-origin.
    #  - img-src allows data: and blob: for the photo preview (URL.createObjectURL).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # Only meaningful over HTTPS; harmless otherwise. Enable once TLS terminates here.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients keep loading an old bundle's
    # asset references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets. Safe to keep long-lived because Vite fingerprints filenames.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
