server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # This app keeps its access and refresh tokens in localStorage, so XSS is a
    # session-theft vector rather than just a defacement risk.
    #
    # The directives live in security-headers.conf because they have to be repeated
    # in every location that sets an add_header of its own — nginx replaces the
    # inherited set rather than merging it. That file explains the rule in full.
    include /etc/nginx/security-headers.conf;

    # React Router — serve index.html for all routes
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients keep loading an old bundle's
    # asset references after a deploy.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets. Safe to keep long-lived because Vite fingerprints filenames.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
